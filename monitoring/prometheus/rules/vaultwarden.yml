groups:
  - name: vaultwarden-backup
    rules:
      # The "dead man's switch" for the jobs: OnFailure= only fires when a job
      # ran and failed. These fire when success simply stopped coming - the
      # timer was disabled or the job hangs. Pi outages require an external
      # monitor: this Prometheus runs on the same host. Daily jobs, so
      # 26 h = one missed run plus some slack.
      - alert: VaultwardenBackupStale
        expr: time() - vaultwarden_backup_last_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No verified Vaultwarden backup for {{ $value | humanizeDuration }}"
          description: "Backups run daily at 03:30. Check: journalctl -u vaultwarden-backup.service"

      - alert: VaultwardenDrillStale
        expr: time() - vaultwarden_drill_last_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful restore drill for {{ $value | humanizeDuration }}"
          description: "Drills run daily at 04:00. Check: journalctl -u vaultwarden-drill.service"

      # Without the metrics the two alerts above cannot fire at all.
      - alert: VaultwardenBackupMetricsMissing
        expr: >
          absent(vaultwarden_backup_last_success_timestamp_seconds)
          or absent(vaultwarden_drill_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup or drill metrics are missing"
          description: "Check /var/lib/node_exporter/textfile and the node-exporter container"

      - alert: TextfileCollectorError
        expr: node_textfile_scrape_error == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter cannot read the *.prom files"
          description: "Check permissions and format in /var/lib/node_exporter/textfile"

  - name: pi-host
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node_exporter on the Pi is down: no host or backup metrics"
          description: "docker compose -f monitoring/compose.yaml ps"

      - alert: PiDiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Pi root filesystem is {{ $value | humanizePercentage }} free"
          description: "Backups and the drill need space on /var/lib"
